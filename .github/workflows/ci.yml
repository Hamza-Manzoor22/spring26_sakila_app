name: Sakila CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask pymysql cryptography

    - name: Lint check (basic)
      run: |
        python -m py_compile app.py || true
        python -m py_compile config.py || true

    - name: Run simple import test
      run: |
        python -c "import flask; import pymysql; print('Imports OK')"

    - name: Docker build test
      run: |
        docker build -t sakila-ci-test .